# Montado em /etc/nginx/conf.d/default.conf no container nginx:alpine (o nginx.conf base da
# imagem já inclui conf.d/*.conf dentro do bloco http{}, por isso não há http{} aqui).
#
# Placeholder __OBS_VM_PRIVATE_IP__ é substituído no deploy (sed), não via envsubst do nginx —
# de propósito, pra não colidir com as variáveis nativas do nginx ($host, $remote_addr etc.)
# que também usam a sintaxe $NOME.

# api.oikos.company — API (pública, sem autenticacao extra)
server {
    listen 443 ssl;
    server_name api.oikos.company;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    location / {
        proxy_pass         http://api:3333;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# oikos.company / www.oikos.company — Web / Next.js (pública, sem autenticacao extra)
server {
    listen 443 ssl;
    server_name oikos.company www.oikos.company;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    location / {
        proxy_pass         http://web:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# grafana.oikos.company — Grafana, na VM de observabilidade (IP privado da VCN)
# Protegido pelo login proprio do Grafana (ver T5) — nginx so encaminha
server {
    listen 443 ssl;
    server_name grafana.oikos.company;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    location / {
        proxy_pass         http://__OBS_VM_PRIVATE_IP__:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Grafana usa websocket pra live updates
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}

# minio.oikos.company — Console do MinIO (porta 9001, login gráfico)
# API S3 (porta 9000) NUNCA exposta aqui — só acessível via rede interna do Docker
# Protegido pelo login proprio do MinIO (ver T5)
server {
    listen 443 ssl;
    server_name minio.oikos.company;

    ssl_certificate     /etc/nginx/certs/origin.pem;
