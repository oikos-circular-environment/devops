server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/promtail-positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: oikos-server
    static_configs:
      - targets:
          - localhost
        labels:
          job: oikos-server
          # Glob captura server.log (ativo) + server.1.log, server.2.log … (rotacionados)
          __path__: /var/log/oikos/server*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            traceId: traceId
            spanId: spanId
            url: url
      - labels:
          level:
          traceId:
          spanId:
      - timestamp:
          source: time
          format: RFC3339Nano
          fallback_formats:
            - RFC3339

  - job_name: oikos-queries
    static_configs:
      - targets:
          - localhost
        labels:
          job: oikos-queries
          __path__: /var/log/oikos/queries*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            traceId: traceId
      - labels:
          level:
          traceId:
      - timestamp:
          source: time
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
