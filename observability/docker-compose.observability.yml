# Stack de observabilidade local — NÃO incluir no docker-compose.prod.yml
#
# Alocação de memória (~1.7 GB):
#   otelcol      512 MB   — recebe OTLP, faz fan-out para Tempo/Prometheus/Loki
#   prometheus   512 MB   — scrape + armazenamento de métricas
#   loki         256 MB   — agregação de logs
#   tempo        256 MB   — distributed tracing
#   promtail      64 MB   — tailing dos arquivos de log do Pino
#   grafana      256 MB   — dashboards
#   alertmanager  64 MB   — roteamento de alertas
#
# Pré-requisito (obrigatório — sem o .env a stack não sobe com credenciais corretas):
#   cp observability/.env.observability.example observability/.env.observability
#   # Gere uma senha própria: openssl rand -base64 32
#
# Para iniciar:
#   npm run obs:up
#
# Acessar Grafana: http://localhost:3000

name: oikos-obs

services:
  otelcol:
    image: otel/opentelemetry-collector-contrib:0.120.0
    volumes:
      - ./otelcol/otelcol-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "8888:8888"    # Self-metrics do collector
      - "8889:8889"    # Prometheus exporter (métricas da app)
      - "13133:13133"  # Health check
    networks:
      - observability_network
    deploy:
      resources:
        limits:
          memory: 512M
    restart: "no"
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-remote-write-receiver"   # k6 faz push direto
      - "--enable-feature=native-histograms"   # aceita histogramas nativos do k6
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--log.level=warn"
    networks:
      - observability_network
    deploy:
      resources:
        limits:
          memory: 512M
    restart: "no"
    depends_on:
      - otelcol

  loki:
    image: grafana/loki:3.4.1
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - observability_network
    deploy:
      resources:
        limits:
          memory: 256M
    restart: "no"

  tempo:
    image: grafana/tempo:2.7.0
    volumes:
      - ./tempo/tempo-config.yml:/etc/tempo/tempo-config.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # HTTP API (consultas do Grafana)
      # Porta 4317 (gRPC) não exposta externamente — uso interno do otelcol→tempo
    command: -config.file=/etc/tempo/tempo-config.yaml
    networks:
      - observability_network
    deploy:
      resources:
        limits:
          memory: 256M
    restart: "no"

  promtail:
    image: grafana/promtail:3.4.1
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      # Aponta para os logs da API — ajuste OIKOS_API_LOGS_PATH se necessário
      - ${OIKOS_API_LOGS_PATH:-../../api/logs}:/var/log/oikos:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - observability_network
    deploy:
      resources:
        limits:
          memory: 64M
    restart: "no"
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.5.0
    env_file:
      - path: ./.env.observability
        required: false   # usa defaults se o arquivo não existir
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_LOG_LEVEL: warn
    networks:
      - observability_network
    deploy:
      resources:
        limits:
          memory: 256M
    restart: "no"
    depends_on:
      - prometheus
      - loki
      - tempo

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--log.level=warn"
    networks:
      - observability_network
    deploy:
      resources:
        limits:
          memory: 64M
    restart: "no"


networks:
  observability_network:
    driver: bridge

volumes:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
