# Override de producao (E2.1.Micro) - ver docs/docker-infra.md#5 (ticket 07, ticket 09)

services:
  prometheus:
    deploy:
      resources:
        limits:
          memory: 200M

  loki:
    deploy:
      resources:
        limits:
          memory: 150M

  tempo:
    # OTLP gRPC exposta pro host - Alloy da A1.Flex alcanca via IP privado (ver docs/docker-infra.md#4)
    ports:
      - "4317:4317"
    deploy:
      resources:
        limits:
          memory: 120M

  grafana:
    # anonymous-auth desabilitado em producao - ver docs/docker-infra.md#4 (ticket 05)
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    deploy:
      resources:
        limits:
          memory: 180M

  alertmanager:
    deploy:
      resources:
        limits:
          memory: 25M
