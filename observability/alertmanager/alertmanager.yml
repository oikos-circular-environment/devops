global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'null'
  routes:
    - matchers:
        - alertname =~ ".*"
      receiver: 'null'

receivers:
  - name: 'null'

