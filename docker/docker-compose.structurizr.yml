# Self-host do Structurizr — o serviço hospedado (structurizr.com) encerra em set/2026.
# Modo `local`: 1 workspace só, sem licença, sem API multi-workspace — suficiente para
# uso individual (gerar/visualizar os diagramas C4 da infra do Oikos). O modo `server`
# (multi-workspace + API) exige licença/trial mesmo para subir, por isso não foi usado.
# Specs/decisão: ver docs/docker-infra.md

name: oikos-structurizr

services:
  structurizr:
    image: structurizr/structurizr:latest
    command: local
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./structurizr/data:/usr/local/structurizr
    restart: "no"

  # MCP server (gratuito/open source): validação, parse e export de DSL (Mermaid/PlantUML)
  # consumido pelo Claude Code — ver devops/.mcp.json
  structurizr-mcp:
    image: structurizr/mcp:latest
    ports:
      - "127.0.0.1:3210:3000"
    environment:
      PORT: "3000"
    command: ["-dsl", "-plantuml", "-mermaid"]
    restart: "no"
