# Stack de produção — VM A1.Flex (2 OCPU/12GB). Migrado de oikos/api/docker-compose.prod.yml (T1),
# ganhou web, nginx, e a camada de coleta de observabilidade (Alloy/cAdvisor/node-exporter).
#
# Orçamento de memória (ver 04-tech-plan.md §Abordagem Arquitetural):
#   postgresql    512 MB     redis       128 MB     minio    256 MB
#   api           512 MB     web         512 MB     nginx     64 MB
#   cadvisor      128 MB     node-exporter 64 MB     alloy    128 MB
#   Total: ~2.3GB de 12GB disponíveis.
#
# Pré-requisito: .env.prod preenchido (ver .env.prod.example) e certs/ com o par
# cloudflare-origin.pem/.key — ambos materializados pelo deploy.yml (T9), nunca commitados.
#
# Só a `api` e o `web` são buildados a partir de contexto local (checkout dos repos irmãos);
# em produção real, `image:` (GHCR) é o que efetivamente roda — `build:` é só pra
# `docker compose build` local antes do primeiro deploy (ver T6, validação via Buildx).

name: oikos-prod

services:
  postgresql:
    image: bitnami/postgresql:latest
    env_file:
      - .env.prod
    environment:
      POSTGRESQL_USERNAME: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE: ${POSTGRES_DB}
      POSTGRESQL_DATABASE_EXTENSIONS: postgis
      POSTGRESQL_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRESQL_MAX_CONNECTIONS: "50"
      POSTGRESQL_SHARED_BUFFERS: "128MB"
      POSTGRESQL_WORK_MEM: "4MB"
      POSTGRESQL_EFFECTIVE_CACHE_SIZE: "384MB"
      # io_method=sync - achado em producao (2026-07-03): Postgres 18 usa
      # io_method=worker por padrao (processos "io worker" dedicados), e o
      # container ficou throttled ~99% dos periodos de CPU (cpu.stat/nr_throttled)
      # rodando so com pg_isready de healthcheck, sem query real ativa. sync e
      # o metodo classico (pre-PG18), sem os workers extras - testar se reduz
      # o overhead antes de investigar mais fundo.
      # Log de query nativo do Postgres avaliado e descartado (2026-07-03) -
      # decisao consciente de usar o PRISMA_QUERY_LOG do api em vez disso, que
      # ja correlaciona com traceId/spanId da requisicao (ver devops/.github/
      # workflows/deploy.yml e api/src/lib/prisma.ts).
      POSTGRESQL_EXTRA_FLAGS: "-c io_method=sync"
    volumes:
      - postgresql_data:/bitnami/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    deploy:
      resources:
        limits:
          # 1.0 -> 1.5: achado em producao (2026-07-03) que o Postgres ficava
          # throttled quase o tempo todo no limite de 1.0 - os outros servicos
          # (exceto cadvisor) usam bem menos que o proprio limite, entao ha
          # folga real na VM (2 OCPU) pra dar mais cpu ao Postgres.
          memory: 512M
          cpus: "1.5"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: bitnami/redis:latest
    env_file:
      - .env.prod
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_AOF_ENABLED: "yes" # persistência — pré-requisito do backup (T8)
      REDIS_EXTRA_FLAGS: "--maxmemory 96mb --maxmemory-policy noeviction"
    volumes:
      - redis_data:/bitnami/redis/data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    env_file:
      - .env.prod
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env.prod
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY};
      mc mb --ignore-existing local/oikos;
      mc anonymous set public local/oikos;
      exit 0;
      "

  api:
    image: ghcr.io/oikos-circular-environment/api:${API_VERSION:-latest}
    build:
      context: ../../api
      dockerfile: ../devops/docker/Dockerfile.api.prod
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: minio
      APP_PUBLIC_URL: https://api.oikos.company
      LOG_LEVEL: info
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    healthcheck:
      # 127.0.0.1 explicito, nao "localhost" - dentro do container "localhost" resolve
      # pra ::1 (IPv6) primeiro, e o Fastify so escuta em IPv4 (0.0.0.0), causando
      # falso-negativo de "connection refused" no healthcheck (achado no bootstrap real, T6)
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  web:
    image: ghcr.io/oikos-circular-environment/web:${WEB_VERSION:-latest}
    build:
      context: ../../web
      dockerfile: ../devops/docker/Dockerfile.web.prod
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=384"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      # Sem isso, a factory de deteccao de container Docker do cAdvisor falha
      # (Docker usa containerd por baixo) e ele so enxerga cgroups agregados
      # (systemd/raw), sem nenhuma metrica por container - achado no
      # bootstrap real (T7): container_memory_usage_bytes existia, mas sem
      # nenhum label de container (nem "name", nem "container_label_*").
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    env_file:
      - .env.prod
    environment:
      PROMETHEUS_REMOTE_WRITE_URL: ${PROMETHEUS_REMOTE_WRITE_URL}
      LOKI_URL: ${LOKI_URL}
      TEMPO_ENDPOINT: ${TEMPO_ENDPOINT}
    volumes:
      - ../observability/alloy/alloy-prod.alloy:/etc/alloy/config.alloy:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 --stability.level=public-preview /etc/alloy/config.alloy
    depends_on:
      - cadvisor
      - node-exporter
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    restart: unless-stopped

volumes:
  postgresql_data:
  redis_data:
  minio_data:

networks:
  default: {}
