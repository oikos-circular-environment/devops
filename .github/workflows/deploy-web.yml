name: Deploy web

on:
  repository_dispatch:
    types: [web-production]
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA do commit a implantar (vazio = resolve da ultima tag)"
        required: false
      version:
        description: "Versao (tag SemVer) a implantar (vazio = ultima tag)"
        required: false

concurrency:
  # Grupo unico - ver docs/docker-infra.md#1
  group: deploy-vm
  cancel-in-progress: false

jobs:
  # --- web: build -> sync -> deploy-container ------------------------------- (ver docs/docker-infra.md#1)
  build:
    runs-on: ubuntu-24.04-arm # arm64 nativo - ver docs/docker-infra.md#1
    environment: web-production
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout devops (Dockerfile)
        uses: actions/checkout@v7

      # (ver ticket 12)
      - name: Resolve versao e SHA (auto quando nao informados)
        id: version
        uses: ./.github/actions/resolve-release
        with:
          repo: oikos-circular-environment/web
          version: ${{ github.event.client_payload.version || inputs.version }}
          sha: ${{ github.event.client_payload.sha || inputs.sha }}
          github-token: ${{ secrets.SOURCE_REPO_PAT }}

      - name: Checkout web (fonte pra build da imagem)
        uses: actions/checkout@v7
        with:
          repository: oikos-circular-environment/web
          ref: ${{ steps.version.outputs.sha }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source/web

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build e push da imagem web (arm64)
        uses: docker/build-push-action@v7
        with:
          context: source/web
          file: docker/Dockerfile.web.prod
          platforms: linux/arm64
          push: true
          tags: ghcr.io/oikos-circular-environment/web:${{ steps.version.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_CLIENT_API_KEY=${{ secrets.NEXT_PUBLIC_CLIENT_API_KEY }}

  sync:
    needs: build
    runs-on: ubuntu-24.04-arm
    environment: web-production
    steps:
      - name: Checkout devops (compose, nginx, observability, scripts)
        uses: actions/checkout@v7

      - name: Configura chave SSH
        uses: ./.github/actions/ssh-setup
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}
          vm-host: ${{ vars.VM_HOST }}

      - name: Sincroniza arquivos de deploy pra VM
        uses: ./.github/actions/sync-deploy-files
        with:
          vm-host: ${{ vars.VM_HOST }}
          obs-private-ip: ${{ vars.OBSERVABILITY_PRIVATE_IP }}

      - name: Renderiza .env.web a partir dos secrets
        env:
          CLIENT_API_KEY: ${{ secrets.CLIENT_API_KEY }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          cat > /tmp/env.web.rendered <<EOF
          WEB_VERSION=${{ needs.build.outputs.version }}
          CLIENT_API_KEY=${CLIENT_API_KEY}
          TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}
          TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
          EOF
          scp -i ~/.ssh/deploy_key /tmp/env.web.rendered deploy@"${{ vars.VM_HOST }}":/opt/oikos/docker/.env.web
          rm -f /tmp/env.web.rendered

  deploy-container:
    needs: sync
    runs-on: ubuntu-24.04-arm
    environment: web-production # sem secrets hoje - ver docs/docker-infra.md#2
    steps:
      - name: Checkout devops
        uses: actions/checkout@v7

      - name: Configura chave SSH
        uses: ./.github/actions/ssh-setup
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}
          vm-host: ${{ vars.VM_HOST }}

      - name: Autentica a VM no GHCR
        uses: ./.github/actions/vm-ghcr-login
        with:
          vm-host: ${{ vars.VM_HOST }}
          username: ${{ github.actor }}
          token: ${{ secrets.GHCR_PAT }}

      - name: Deploy targeted do servico web
        run: |
          ssh -i ~/.ssh/deploy_key deploy@"${{ vars.VM_HOST }}" \
            "cd /opt/oikos/docker && docker compose --env-file .env.infra --env-file .env.api --env-file .env.web -f docker-compose.prod.yml pull web && docker compose --env-file .env.infra --env-file .env.api --env-file .env.web -f docker-compose.prod.yml up -d web"

      # (ver ticket 11)
      - name: Recria nginx e alloy (bind mount de arquivo unico nao atualiza com reload/restart)
        run: |
          ssh -i ~/.ssh/deploy_key deploy@"${{ vars.VM_HOST }}" \
            "cd /opt/oikos/docker && docker compose --env-file .env.infra --env-file .env.api --env-file .env.web -f docker-compose.prod.yml up -d --force-recreate --no-deps nginx alloy"
