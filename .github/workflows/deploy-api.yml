name: Deploy api

on:
  repository_dispatch:
    types: [api-production]
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA do commit a implantar (vazio = resolve da ultima tag)"
        required: false
      version:
        description: "Versao (tag SemVer) a implantar (vazio = ultima tag)"
        required: false

concurrency:
  # Grupo unico - ver docs/docker-infra.md#1
  group: deploy-vm
  cancel-in-progress: false

jobs:
  # --- api: build -> sync -> migrate -> deploy-container ------------------ (ver docs/docker-infra.md#1)
  build:
    runs-on: ubuntu-24.04-arm # arm64 nativo - ver docs/docker-infra.md#1
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout devops (Dockerfile)
        uses: actions/checkout@v7

      # Resolucao de versao/SHA - ver docs/docker-infra.md#1 (ticket 12)
      - name: Resolve versao e SHA (auto quando nao informados)
        id: version
        uses: ./.github/actions/resolve-release
        with:
          repo: oikos-circular-environment/api
          version: ${{ github.event.client_payload.version || inputs.version }}
          sha: ${{ github.event.client_payload.sha || inputs.sha }}
          github-token: ${{ secrets.SOURCE_REPO_PAT }}

      - name: Checkout api (fonte pra build da imagem)
        uses: actions/checkout@v7
        with:
          repository: oikos-circular-environment/api
          ref: ${{ steps.version.outputs.sha }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source/api

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build e push da imagem api (arm64)
        uses: docker/build-push-action@v7
        with:
          context: source/api
          file: docker/Dockerfile.api.prod
          platforms: linux/arm64
          push: true
          tags: ghcr.io/oikos-circular-environment/api:${{ steps.version.outputs.tag }}

  sync:
    needs: build
    runs-on: ubuntu-24.04-arm
    environment: api-production # secrets de app - ver docs/docker-infra.md#2
    steps:
      - name: Checkout devops (compose, nginx, observability, scripts)
        uses: actions/checkout@v7

      - name: Configura chave SSH
        uses: ./.github/actions/ssh-setup
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}
          vm-host: ${{ vars.VM_HOST }}

      # Renderizado localmente, nao via sed remoto - ver docs/docker-infra.md#2
      - name: Renderiza .env.api a partir dos secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CLIENT_KEY_MOBILE: ${{ secrets.CLIENT_KEY_MOBILE }}
          CLIENT_KEY_WEB: ${{ secrets.CLIENT_KEY_WEB }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: |
          cat > /tmp/env.api.rendered <<EOF
          API_VERSION=${{ needs.build.outputs.version }}
          JWT_SECRET=${JWT_SECRET}
          ADMIN_USERNAME=${ADMIN_USERNAME}
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          QUORUM_JOB_DELAY_MS=86400000
          ACCOUNT_DELETION_DELAY_MS=7776000000
          WORKER_CONCURRENCY=5
          PRISMA_QUERY_LOG=true
          CLIENT_KEY_MOBILE=${CLIENT_KEY_MOBILE}
          CLIENT_KEY_WEB=${CLIENT_KEY_WEB}
          CLIENT_KEY_ENFORCE=true
          BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
          EMAIL_PROVIDER=resend
          RESEND_API_KEY=${RESEND_API_KEY}
          RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
          EOF
          scp -i ~/.ssh/deploy_key /tmp/env.api.rendered deploy@"${{ vars.VM_HOST }}":/opt/oikos/docker/.env.api
          rm -f /tmp/env.api.rendered

      - name: Sincroniza arquivos de deploy pra VM
        uses: ./.github/actions/sync-deploy-files
        with:
          vm-host: ${{ vars.VM_HOST }}
          obs-private-ip: ${{ vars.OBSERVABILITY_PRIVATE_IP }}

  migrate:
    needs: sync
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout devops
        uses: actions/checkout@v7

      - name: Configura chave SSH
        uses: ./.github/actions/ssh-setup
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}
          vm-host: ${{ vars.VM_HOST }}

      - name: Autentica a VM no GHCR
        uses: ./.github/actions/vm-ghcr-login
        with:
          vm-host: ${{ vars.VM_HOST }}
          username: ${{ github.actor }}
          token: ${{ secrets.GHCR_PAT }}

      - name: Roda a migration (para o deploy se falhar - container antigo continua servindo)
        run: |
          ssh -i ~/.ssh/deploy_key deploy@"${{ vars.VM_HOST }}" \
            "cd /opt/oikos/docker && docker compose --env-file .env.infra --env-file .env.api --env-file .env.web -f docker-compose.prod.yml run --rm api npx prisma migrate deploy"

  deploy-container:
    needs: migrate
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout devops
        uses: actions/checkout@v7

      - name: Configura chave SSH
        uses: ./.github/actions/ssh-setup
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}
          vm-host: ${{ vars.VM_HOST }}

      - name: Autentica a VM no GHCR
        uses: ./.github/actions/vm-ghcr-login
        with:
          vm-host: ${{ vars.VM_HOST }}
          username: ${{ github.actor }}
          token: ${{ secrets.GHCR_PAT }}

      - name: Deploy targeted do servico api
        run: |
          ssh -i ~/.ssh/deploy_key deploy@"${{ vars.VM_HOST }}" \
            "cd /opt/oikos/docker && docker compose --env-file .env.infra --env-file .env.api --env-file .env.web -f docker-compose.prod.yml pull api && docker compose --env-file .env.infra --env-file .env.api --env-file .env.web -f docker-compose.prod.yml up -d api"

      # gotcha bind-mount - ver docs/docker-infra.md#6 (ticket 11)
      - name: Recria nginx e alloy (bind mount de arquivo unico nao atualiza com reload/restart)
        run: |
          ssh -i ~/.ssh/deploy_key deploy@"${{ vars.VM_HOST }}" \
            "cd /opt/oikos/docker && docker compose --env-file .env.infra --env-file .env.api --env-file .env.web -f docker-compose.prod.yml up -d --force-recreate --no-deps nginx alloy"
